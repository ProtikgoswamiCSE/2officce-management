<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Doptor Tech — Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20222A; --paper:#F5F3EE; --paper-2:#ECE9E1; --panel:#FFFFFF;
    --charcoal:#1B1D24; --charcoal-2:#252832;
    --teal:#2AA9A0; --teal-dark:#1E7F78;
    --amber:#E0A526; --red:#C6483C; --green:#4C9A5B;
    --slate:#7A7F8C; --line:#DCD8CE; --line-dark:#33363F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;border-radius:6px;}
  input,select,textarea{font-family:'Inter',sans-serif;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);width:100%;}
  textarea{resize:vertical;min-height:60px;}
  #loadError{display:none;background:#3a1f1f;border:1px solid var(--red);color:#f2c9c4;padding:16px 20px;margin:20px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;}
  #loadError b{color:#fff;font-family:'Inter',sans-serif;display:block;margin-bottom:8px;font-size:14px;}
  #loadError button{margin-top:10px;background:var(--red);color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;}
  label{font-size:12px;color:var(--slate);display:block;margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}

  /* ---- Login ---- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--charcoal);padding:24px 16px;}
  .login-card{background:var(--paper);width:min(360px,100%);padding:36px 32px;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .login-card .stamp{width:34px;height:34px;background:var(--teal);border-radius:6px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .login-card h1{font-size:20px;margin:0 0 2px;}
  .login-card p.sub{color:var(--slate);font-size:13px;margin:0 0 20px;}
  .btn{padding:10px 16px;border-radius:6px;font-weight:600;font-size:13px;}
  .btn-primary{background:var(--charcoal);color:#fff;width:100%;margin-top:16px;}
  .btn-primary:hover{background:var(--teal-dark);}
  .err{color:var(--red);font-size:12px;margin-top:10px;}

  html{-webkit-text-size-adjust:100%;}
  html,body{max-width:100%;}

  /* ---- App shell ---- */
  #app{display:none;min-height:100vh;}
  #app.is-on{display:block;padding-left:220px;}
  #sidebar{background:var(--charcoal);color:#EDEBE4;padding:20px 14px;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:30;height:100vh;height:100dvh;width:220px;overflow:hidden;}
  #sidebar .stamp{width:30px;height:30px;background:var(--teal);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-bottom:6px;}
  #sidebar .brand{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin-bottom:2px;}
  #sidebar .brand-sub{color:var(--slate);font-size:11px;margin-bottom:8px;}
  .user-id{margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line-dark);}
  .user-id .user-name{color:#EDEBE4;font-size:13px;font-weight:600;line-height:1.3;}
  .user-id .user-mail{color:var(--slate);font-size:11px;margin-top:3px;word-break:break-all;line-height:1.4;}
  .nav-btn{display:block;width:100%;text-align:left;background:transparent;color:#C9C7C0;padding:9px 10px;border-radius:6px;font-size:13px;margin-bottom:2px;font-weight:500;}
  .nav-btn:hover{background:var(--charcoal-2);}
  .nav-btn.active{background:var(--teal);color:#fff;}
  #navLinks{flex:1;overflow-y:auto;min-height:0;margin-bottom:8px;}
  #whoami{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-dark);font-size:12px;color:var(--slate);}
  #whoami b{color:#EDEBE4;display:block;font-size:13px;}
  #logoutBtn{margin-top:8px;background:var(--charcoal-2);color:#EDEBE4;font-size:12px;padding:7px 10px;width:100%;}

  .app-body{min-width:0;max-width:100%;}
  #main{padding:26px 34px;min-width:0;max-width:100%;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:0 0 10px;}
  .table-scroll table{min-width:620px;}
  .mobile-bar{display:none;}
  .nav-overlay{display:none;position:fixed;inset:0;background:rgba(12,13,16,.5);z-index:55;}
  .nav-overlay.show{display:block;}
  .sidebar-close{display:none;}
  body.nav-open{overflow:hidden;}

  .topline{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;border-bottom:2px solid var(--ink);padding-bottom:12px;gap:10px;flex-wrap:wrap;}
  .topline h2{margin:0;font-size:22px;}
  .topline .role-badge{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-dark);font-weight:700;}
  .add-btn{background:var(--teal);color:#fff;padding:9px 14px;font-size:13px;font-weight:600;}
  .add-btn:hover{background:var(--teal-dark);}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:6px;padding:12px 16px;min-width:0;}
  .stat-card.warn{border-left-color:var(--amber);}
  .stat-card.danger{border-left-color:var(--red);}
  .stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
  .stat-card .lbl{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;}

  /* Leaderboard dashboard */
  .lb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .lb-header .lb-sub{color:var(--slate);font-size:12px;margin-top:2px;}
  .lb-header select{width:auto;display:inline-block;padding:7px 10px;font-size:12px;}
  .top-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
  @media(max-width:820px){.top-row{grid-template-columns:1fr;}}
  .top-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;position:relative;overflow:hidden;}
  .top-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--teal),var(--amber));}
  .top-card .badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-dark);background:rgba(42,169,160,.12);padding:4px 9px;border-radius:20px;margin-bottom:12px;}
  .top-card .who{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .top-card .name{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;}
  .top-card .sub{font-size:11px;color:var(--slate);}
  .top-card .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .top-card .stat-pill{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 12px;flex:1;min-width:90px;}
  .top-card .stat-pill .k{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);}
  .top-card .stat-pill .v{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin-top:2px;}
  .top-card.empty-card{display:flex;align-items:center;justify-content:center;color:var(--slate);font-size:13px;min-height:120px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--charcoal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:'Space Grotesk',sans-serif;flex-shrink:0;}
  .avatar.sm{width:28px;height:28px;font-size:11px;}
  .lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
  @media(max-width:900px){.lb-grid{grid-template-columns:1fr;}}
  .lb-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 16px 8px;}
  .lb-panel h3{margin:0 0 2px;font-size:14px;}
  .lb-panel .lb-panel-sub{font-size:11px;color:var(--slate);margin-bottom:12px;}
  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
  .lb-row:last-child{border-bottom:none;}
  .rank-badge{width:26px;text-align:center;font-size:13px;font-weight:700;color:var(--slate);flex-shrink:0;}
  .rank-badge.r1{font-size:16px;}
  .lb-row-name{flex:1;min-width:0;}
  .lb-row-name .n{font-size:13px;font-weight:600;}
  .lb-row-name .n a{color:var(--ink);text-decoration:none;}
  .lb-row-name .n a:hover{color:var(--teal-dark);text-decoration:underline;}
  .lb-row-name .t{font-size:11px;color:var(--slate);}
  .lb-row-metric{text-align:right;flex-shrink:0;}
  .lb-row-metric .v{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
  .lb-row-metric .l{font-size:9px;color:var(--slate);text-transform:uppercase;}
  .progress-track{background:var(--line);height:5px;border-radius:3px;margin-top:5px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--teal);border-radius:3px;}
  .lb-mini-stats{display:flex;gap:10px;font-size:11px;color:var(--slate);flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:280px;}
  .lb-mini-stats b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}

  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden;box-shadow:0 1px 0 var(--line);}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);padding:10px 12px;border-bottom:2px solid var(--ink);background:var(--paper-2);}
  td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FAF9F6;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .tag.status-Not-Started{background:#E9E7E1;color:#5A5D66;}
  .tag.status-In-Progress{background:#DDF0EE;color:var(--teal-dark);}
  .tag.status-Waiting-on-Client{background:#FBEACB;color:#8A6512;}
  .tag.status-In-Review{background:#E4E1F5;color:#5B4E9E;}
  .tag.status-Completed{background:#DEF0E1;color:var(--green);}
  .tag.status-On-Hold{background:#EFEFEF;color:#888;}
  .tag.pri-High{background:#F6DAD6;color:var(--red);}
  .tag.pri-Medium{background:#FBEACB;color:#8A6512;}
  .tag.pri-Low{background:#E4E4E4;color:#666;}
  .overdue{color:var(--red);font-weight:700;}
  .row-actions button{background:transparent;color:var(--slate);font-size:12px;padding:3px 6px;}
  .row-actions button:hover{color:var(--ink);text-decoration:underline;}
  .empty{padding:30px;text-align:center;color:var(--slate);font-size:13px;}

  /* modal */
  #modalBg{display:none;position:fixed;inset:0;background:rgba(20,21,26,.5);align-items:center;justify-content:center;z-index:50;}
  #modal{background:#fff;width:460px;max-height:88vh;overflow-y:auto;border-radius:10px;padding:24px 26px;}
  #modal h3{margin:0 0 4px;font-size:17px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .modal-actions .btn-cancel{background:var(--paper-2);color:var(--ink);flex:1;padding:9px;}
  .modal-actions .btn-save{background:var(--teal);color:#fff;flex:1;padding:9px;font-weight:600;}
  .setup-note{font-size:11px;color:var(--slate);background:var(--paper-2);border-radius:6px;padding:8px 10px;margin-top:10px;line-height:1.5;}
  .portal-h{font-size:14px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;}
  .portal-h .count{font-size:11px;color:var(--slate);font-weight:600;font-family:'Inter',sans-serif;}
  .pw-cell{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pw-cell .pw-text{font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .drag-handle{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:32px;min-height:32px;
    color:var(--slate);font-size:16px;line-height:1;
    cursor:grab;user-select:none;touch-action:none;
    letter-spacing:-2px;padding:0 4px;
  }
  .drag-handle:active{cursor:grabbing;}
  tr.user-drag-row.dragging{position:relative;z-index:2;box-shadow:0 4px 14px rgba(20,21,26,.12);}
  body.user-row-dragging{cursor:grabbing;user-select:none;}
  tr.user-drag-row.role-company td{background:#E8F6F5;}
  tr.user-drag-row.role-pm td{background:#FBF3E0;}
  tr.user-drag-row.role-seller td{background:#FCEEE9;}
  tr.user-drag-row.role-dev td{background:#EAF5EC;}
  tr.user-drag-row.dragging td{background:#FAF9F6;opacity:.75;}
  .live-countdown{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--teal-dark);white-space:nowrap;}
  .live-countdown.overdue{color:var(--red);font-weight:700;}
  .stage-select{padding:5px 7px;font-size:12px;width:auto;min-width:140px;}

  /* ---- Responsive: tablet + mobile ---- */
  @media(max-width:1100px){
    #app.is-on{display:block;padding-left:0;}
    .mobile-bar{
      display:flex;align-items:center;gap:10px;
      position:sticky;top:0;z-index:40;
      background:var(--charcoal);color:#EDEBE4;
      padding:10px 14px;min-height:52px;
    }
    .menu-btn{
      width:40px;height:40px;flex-shrink:0;
      background:var(--charcoal-2);color:#fff;font-size:20px;line-height:1;border-radius:8px;
    }
    .mobile-bar .mb-stamp{
      width:26px;height:26px;background:var(--teal);border-radius:5px;
      display:flex;align-items:center;justify-content:center;
      font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:11px;color:#fff;
    }
    .mobile-bar .mb-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;}
    #sidebar{
      position:fixed !important;top:0;left:0;bottom:0;z-index:60;
      width:min(280px,88vw) !important;height:100dvh !important;
      transform:translateX(-105%);
      transition:transform .22s ease;
      overflow-y:auto;
      pointer-events:none;
    }
    #sidebar.open{transform:translateX(0);pointer-events:auto;}
    .sidebar-close{
      display:flex;align-items:center;justify-content:center;align-self:flex-end;margin:-4px 0 8px auto;
      background:var(--charcoal-2);color:#EDEBE4;width:32px;height:32px;font-size:16px;
    }
    #loginScreen{align-items:flex-start;padding:20px 14px 32px;}
    .login-card{padding:28px 20px;}
    #main{padding:16px 14px 28px;}
    .topline h2{font-size:18px;}
    .top-row,.lb-grid{grid-template-columns:1fr;}
    #modalBg{padding:12px;align-items:flex-start;}
    #modal{width:min(460px,100%);padding:20px 16px;max-height:min(86vh,100%);}
    .lb-mini-stats{max-width:100%;justify-content:flex-start;}
    input,select,textarea,.btn,.nav-btn{font-size:16px;}
    .stage-select{min-width:0;max-width:100%;}
    .lb-header select{width:100%;max-width:220px;}
  }

  @media(max-width:640px){
    .login-card{padding:22px 16px;}
    .stat-row{grid-template-columns:1fr 1fr;gap:8px;}
    .stat-card{padding:10px 12px;}
    .stat-card .num{font-size:20px;}
    .topline{align-items:stretch;flex-direction:column;}
    .topline h2{font-size:17px;}
    .add-btn{width:100%;text-align:center;}
    .top-card{padding:14px;}
    .lb-panel{padding:12px 10px 6px;}
    .lb-row{flex-wrap:wrap;align-items:flex-start;}
    .lb-mini-stats{width:100%;margin-top:4px;}
    .modal-actions{flex-direction:column;}
    #main{padding:12px 10px 24px;}
    .live-countdown{white-space:normal;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="stamp">DT</div>
    <h1>Doptor Tech Ledger</h1>
    <p class="sub">Company portal — Admin</p>
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="you@doptortech.com">
    <label>Password</label>
    <input id="loginPass" type="password" placeholder="••••••••">
    <button class="btn btn-primary" onclick="doLogin()">Sign in</button>
    <div style="text-align:right;margin-top:8px;">
      <a href="#" style="font-size:12px;color:var(--teal-dark);text-decoration:none;" onclick="doForgotPassword();return false;">Forgot password?</a>
    </div>
    <div class="err" id="loginErr"></div>
    <div id="loginMsg" style="font-size:12px;color:var(--green);margin-top:6px;"></div>
    <div class="setup-note">First run? Sign in with the Admin email/password configured by your CEO. If no account exists yet for that email, it will be created automatically and granted Admin rights.</div>
  </div>
</div>

<div class="nav-overlay" id="navOverlay" onclick="closeNav()"></div>
<div id="app">
  <div id="sidebar">
    <button type="button" class="sidebar-close" onclick="closeNav()" aria-label="Close menu">✕</button>
    <div class="stamp">DT</div>
    <div class="brand">Doptor Tech</div>
    <div class="brand-sub">Company</div>
    <div id="userId" class="user-id">
      <div class="user-name" id="userName"></div>
      <div class="user-mail" id="userMail"></div>
    </div>
    <div id="navLinks"></div>
    <div id="whoami"></div>
    <button id="logoutBtn" onclick="doLogout()">Sign out</button>
  </div>
  <div class="app-body">
    <div class="mobile-bar">
      <button type="button" class="menu-btn" onclick="openNav()" aria-label="Open menu">☰</button>
      <span class="mb-stamp">DT</span>
      <span class="mb-title">Doptor Tech</span>
    </div>
    <div id="loadError"></div>
    <div id="main"></div>
  </div>
</div>

<div id="modalBg"><div id="modal"></div></div>

<script src="local-backend.js?v=20260829"></script>
<script>
const auth = firebase.auth();
const db = firebase.firestore();
const secondaryApp = firebase.initializeApp({}, "Secondary");
const secondaryAuth = secondaryApp.auth();

/* ============================================================
   HARDCODED ADMIN (Account Owner)
   This is the CEO / super-authority account. On first sign-in,
   if no user record exists yet for this UID, one is created
   automatically with role "Admin".
   ============================================================ */
const ADMIN_EMAIL = "mdabdulquiyumbadol@gmail.com";
const ADMIN_PASS  = "1234567";
const ADMIN_UID   = "7tFGqtHIuMdJrLEEvBD7ElfNbPC2"; // fill in after first login (see console)

/* Company Admins — first sign-in creates Auth + Firestore (role: Admin). Not Super Admin. */
const COMPANY_ADMIN_ACCOUNTS = [
  { name:"Sanaul", email:"sanaul.doptortech@gmail.com", pass:"12345678" }
];
function companyAdminByEmail(email){
  const e = (email||"").trim().toLowerCase();
  return COMPANY_ADMIN_ACCOUNTS.find(a => a.email.toLowerCase() === e) || null;
}
function isCompanyAdminUser(){
  return !!(CURRENT_USER && CURRENT_USER.role === "Admin" && !isSA(CURRENT_USER.uid));
}

/* ============================================================
   SUPER ADMIN (SA) — the ADMIN_UID account above.
   - SA has full authority over everything, including other
     "Admin" role accounts that SA itself creates/promotes.
   - SA's own name/email/identity is never shown to anyone
     else, including other Admins — everyone else just sees
     that "an Admin" exists, with no further detail.
   - Admins that SA appoints cannot view, edit, restrict, or
     delete the SA account, and cannot see who it is.
   ============================================================ */
function isSA(uid){ return uid === ADMIN_UID; }
function viewerIsSA(){ return CURRENT_USER && CURRENT_USER.uid === ADMIN_UID; }
// Use this instead of a raw name/email anywhere a user might be displayed.
function displayNameFor(u){
  if(!u) return "—";
  const targetUid = u.uid || u.id;
  if(isSA(targetUid) && !viewerIsSA()){
    return "Admin"; // identity hidden — only "there is an admin" is visible
  }
  return u.name || "—";
}

/* ============================================================
   STATE
   ============================================================ */
let CURRENT_USER = null;   // {uid, name, role, team, ...}
let ALL_USERS = [];
let USER_ORDER = [];
let USER_ROW_DRAGGING = false;
let ALL_CLIENTS = [];
let ALL_PROJECTS = [];
let ALL_PROFILES = [];
let ALL_STAGES = [];        // Developing Stages, Admin-managed (System Management)
let ALL_STATUSES = [];      // Project Statuses, Admin-managed (System Management) — each {name, isDelivery, isDelayed}
let ALL_UPDATES = [];       // cached recent daily updates, used for "last update" lookups
let COMPANY_SETTINGS = { salesTarget:0, deliveryTarget:0 };  // company-wide targets, Admin-set
let currentView = "dashboard";
let systemTab = "targets";  // which sub-tab is open on the System Management page
let DEV_DETAIL_ID = null;   // which developer's detail page is open (Admin/PM drill-down only)
let dashboardMonth = new Date().toISOString().slice(0,7); // "YYYY-MM", switchable on the dashboard
const ROLES = ["Admin","Project Manager","Team Lead","Developer","Freelancer","Sales"];
const THIS_PAGE = "company";

/* ============================================================
   AUTH
   ============================================================ */
function isMissingUserErr(e){
  const code = (e && e.code) || "";
  const msg = String((e && e.message) || "").toLowerCase();
  return code === "auth/user-not-found"
    || code === "auth/invalid-login-credentials"
    || code === "auth/invalid-credential"
    || code === "auth/wrong-password"
    || msg.includes("invalid-credential")
    || msg.includes("invalid-login-credentials")
    || msg.includes("user-not-found")
    || msg.includes("wrong-password");
}
async function createAuthUserOnSecondary(email, pass){
  try{
    await secondaryAuth.createUserWithEmailAndPassword(email, pass);
  }catch(e){
    if(e.code !== "auth/email-already-in-use") throw e;
  }finally{
    try{ await secondaryAuth.signOut(); }catch(_){}
  }
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = "";
  if(!email || !pass){ errEl.textContent = "Enter email and password."; return; }
  const companyAdmin = companyAdminByEmail(email);
  const canSeed = (email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && pass === ADMIN_PASS)
    || (companyAdmin && pass === companyAdmin.pass);
  try{
    await auth.signInWithEmailAndPassword(email, pass);
    return;
  }catch(e){
    if(canSeed && firebase.localAuth && firebase.localAuth.setPasswordByEmail(email, pass)){
      try{
        await auth.signInWithEmailAndPassword(email, pass);
        return;
      }catch(_){}
    }
    if(!canSeed || !isMissingUserErr(e)){
      errEl.textContent = e.message || String(e);
      return;
    }
  }
  try{
    await createAuthUserOnSecondary(email, pass);
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e2){
    errEl.textContent = (e2.code === "auth/email-already-in-use" || isMissingUserErr(e2))
      ? "This email already has a different password. Ask an Admin to set a new one from User Manage."
      : (e2.message || String(e2));
  }
}
function doLogout(){ auth.signOut().then(()=> location.href = "main.html"); }

async function doForgotPassword(){
  const email = document.getElementById('loginEmail').value.trim();
  const errEl = document.getElementById('loginErr');
  const msgEl = document.getElementById('loginMsg');
  errEl.textContent = ""; msgEl.textContent = "";
  if(!email){ errEl.textContent = "Enter your email above first, then click 'Forgot password?'"; return; }
  try{
    await auth.sendPasswordResetEmail(email);
    msgEl.textContent = "Local login has no email reset. Ask a Company Admin to set a new password from User Manage.";
  }catch(e){
    msgEl.textContent = "Local login has no email reset. Ask a Company Admin to set a new password from User Manage.";
  }
}

function showLoadError(title, err){
  const el = document.getElementById('loadError');
  const code = (err && err.code) ? err.code : 'unknown';
  const msg = (err && err.message) ? err.message : String(err);
  el.style.display = 'block';
  el.innerHTML = `<b>${title}</b>Error code: ${code}\n${msg}\n\n` +
    (code === 'permission-denied'
      ? `Could not load data for this account. Try signing out and back in, or ask an Admin.`
      : `Check the browser console (F12) for more detail, or contact your Admin.`) +
    `\n\nYour account: ${(CURRENT_USER && CURRENT_USER.email) || (auth.currentUser && auth.currentUser.email) || 'unknown'}`;
  el.innerHTML += '<br><button onclick="doLogout()">Sign out</button>';
}

auth.onAuthStateChanged(async (fbUser) => {
  document.getElementById('loadError').style.display = 'none';
  if(!fbUser){
    stopRealtimeSync();
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').classList.remove('is-on');
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('is-on');
  try{
    const isSaEmail = fbUser.email && fbUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
    const companyAdmin = companyAdminByEmail(fbUser.email);
    const uref = db.collection('users').doc(fbUser.uid);
    let data = null;
    try{
      const usnap = await uref.get();
      if(usnap.exists) data = usnap.data();
    }catch(readErr){
      console.warn("profile read failed", readErr);
    }
    const seedDoc = companyAdmin
      ? { name: companyAdmin.name, role:"Admin", team:"", workHours:"", timezone:"", contact: companyAdmin.email, active:true, profiles:[] }
      : isSaEmail
      ? { name:"Admin", role:"Admin", team:"", workHours:"", timezone:"", contact: fbUser.email, active:true, profiles:[] }
      : null;
    if(!data){
      if(!seedDoc){
        showLoadError("No profile record found", {code:'no-profile', message:"Your account exists in Auth but has no profile record yet. Ask an Admin to create your user record with your UID: " + fbUser.uid});
        return;
      }
      data = { ...seedDoc };
      try{ await uref.set(seedDoc); }catch(writeErr){ console.warn("profile write failed", writeErr); }
    }
    if(companyAdmin){
      const patch = {};
      if(data.role !== "Admin") patch.role = "Admin";
      if(!data.name) patch.name = companyAdmin.name;
      if(data.active === false) patch.active = true;
      if(data.banned === true) patch.banned = false;
      if(Object.keys(patch).length){
        data = { ...data, ...patch };
        try{ await uref.set(patch, { merge:true }); }catch(_){}
      }
    }
    if(!data){
      showLoadError("Account record missing", {code:'deleted', message:"Your user record no longer exists. Contact your Admin if this is a mistake."});
      auth.signOut();
      return;
    }
    if((data.active === false || data.banned === true) && !companyAdmin){
      showLoadError("Account restricted", {code:'restricted', message:"This account has been restricted by an Admin."});
      auth.signOut();
      return;
    }
    CURRENT_USER = { uid: fbUser.uid, email: fbUser.email, ...data };
    if(!allowedOnThisPage(CURRENT_USER.role)){
      const dest = PAGE_FILES[CURRENT_USER.role];
      if(dest){ location.replace(dest); return; }
      await auth.signOut();
      const errEl = document.getElementById('loginErr');
      if(errEl) errEl.textContent = "This account is " + CURRENT_USER.role + ". It cannot enter the " + thisPortalName() + " portal. Use your own login profile.";
      return;
    }
    await loadAll();
    await seedDefaultStatusesIfNeeded();
    renderShell();
    navigate('dashboard');
    setupRealtimeSync();
  }catch(err){
    console.error('Auth/load failure:', err);
    showLoadError("Couldn't load your data", err);
  }
});

/* ============================================================
   DATA LOADING (client-side role filtering — pair with Firestore
   security rules server-side for real enforcement)
   ============================================================ */
async function loadAll(){
  let userDocs = [];
  try{
    userDocs = (await db.collection('users').get()).docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    console.warn('users list failed', e);
    try{
      const mine = await db.collection('users').doc(CURRENT_USER.uid).get();
      userDocs = mine.exists ? [{id:mine.id,...mine.data()}] : [{id:CURRENT_USER.uid,...CURRENT_USER}];
    }catch(_){
      userDocs = CURRENT_USER ? [{id:CURRENT_USER.uid,...CURRENT_USER}] : [];
    }
  }
  const [c,p,pr,st,stat] = await Promise.all([
    db.collection('clients').get(),
    db.collection('projects').get(),
    db.collection('profiles').get(),
    db.collection('stages').get(),
    db.collection('statuses').get()
  ]);
  ALL_USERS = userDocs;
  ALL_CLIENTS = c.docs.map(d=>({id:d.id,...d.data()}));
  ALL_PROJECTS = p.docs.map(d=>({id:d.id,...d.data()}));
  ALL_PROFILES = pr.docs.map(d=>({id:d.id,...d.data()}));
  ALL_STAGES = st.docs.map(d=>({id:d.id,...d.data()}));
  ALL_STATUSES = stat.docs.map(d=>({id:d.id,...d.data()}));
  // Daily updates are fetched separately (capped) so "last update" lookups
  // work on the dashboard without pulling the entire history every load.
  try{
    const us = await db.collection('dailyUpdates').orderBy('date','desc').limit(500).get();
    ALL_UPDATES = us.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ ALL_UPDATES = []; }
  try{
    const settingsSnap = await db.collection('settings').doc('company').get();
    COMPANY_SETTINGS = settingsSnap.exists ? settingsSnap.data() : { salesTarget:0, deliveryTarget:0 };
  }catch(e){ COMPANY_SETTINGS = { salesTarget:0, deliveryTarget:0 }; }
  try{
    const orderSnap = await db.collection('settings').doc('userOrder').get();
    USER_ORDER = orderSnap.exists && Array.isArray(orderSnap.data().ids) ? orderSnap.data().ids : [];
  }catch(e){ USER_ORDER = []; }
}
// Runs once, the first time anyone loads the app after this feature ships:
// if no Project Statuses have been defined yet under System Management,
// write the previous hardcoded list in as a starting point (with the same
// "Completed = delivery" / "Waiting on Client, On Hold = delayed" flags it
// always implicitly had) so existing projects keep working exactly as
// before. From then on Admin fully owns this list — rename, add, remove,
// re-flag — under System Management → Statuses.
async function seedDefaultStatusesIfNeeded(){
  if(ALL_STATUSES.length) return;
  try{
    const batch = db.batch();
    DEFAULT_STATUSES.forEach(s=>{
      const ref = db.collection('statuses').doc();
      batch.set(ref, s);
    });
    await batch.commit();
    const stat = await db.collection('statuses').get();
    ALL_STATUSES = stat.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ console.error('status seed failed', e); }
}
/* ============================================================
   REAL-TIME SYNC
   Firestore onSnapshot listeners keep every collection live, so any
   change (a project's stage, a new update, a target, etc.) from
   anyone shows up for everyone immediately — no manual refresh.
   ============================================================ */
let REALTIME_UNSUBS = [];
function stopRealtimeSync(){
  REALTIME_UNSUBS.forEach(u=>{ try{ u(); }catch(e){} });
  REALTIME_UNSUBS = [];
}
function maybeRerender(){
  if(USER_ROW_DRAGGING && currentView === 'users') return;
  if(CURRENT_USER && currentView) navigate(currentView);
}
function setupRealtimeSync(){
  stopRealtimeSync();
  const liveCollections = [
    ['users', list=>ALL_USERS=list],
    ['clients', list=>ALL_CLIENTS=list],
    ['projects', list=>ALL_PROJECTS=list],
    ['profiles', list=>ALL_PROFILES=list],
    ['stages', list=>ALL_STAGES=list],
    ['statuses', list=>ALL_STATUSES=list],
  ];
  liveCollections.forEach(([coll, setter])=>{
    const unsub = db.collection(coll).onSnapshot(snap=>{
      setter(snap.docs.map(d=>({id:d.id,...d.data()})));
      maybeRerender();
    }, err=>console.error(coll+' live sync error', err));
    REALTIME_UNSUBS.push(unsub);
  });
  const unsubUpdates = db.collection('dailyUpdates').orderBy('date','desc').limit(500).onSnapshot(snap=>{
    ALL_UPDATES = snap.docs.map(d=>({id:d.id,...d.data()}));
    maybeRerender();
  }, err=>{ ALL_UPDATES = []; });
  REALTIME_UNSUBS.push(unsubUpdates);
  const unsubSettings = db.collection('settings').doc('company').onSnapshot(doc=>{
    COMPANY_SETTINGS = doc.exists ? doc.data() : { salesTarget:0, deliveryTarget:0 };
    maybeRerender();
  }, err=>console.error('settings live sync error', err));
  REALTIME_UNSUBS.push(unsubSettings);
  const unsubOrder = db.collection('settings').doc('userOrder').onSnapshot(doc=>{
    USER_ORDER = doc.exists && Array.isArray(doc.data().ids) ? doc.data().ids : [];
    maybeRerender();
  }, err=>console.error('userOrder live sync error', err));
  REALTIME_UNSUBS.push(unsubOrder);
}
function latestUpdateForProject(projectId){
  return ALL_UPDATES.filter(u=>u.projectId===projectId).sort((a,b)=> (b.date||'').localeCompare(a.date||''))[0] || null;
}
function monthOf(dateStr){ return dateStr ? String(dateStr).slice(0,7) : null; }

function visibleProjects(){

function clientName(cid){ const c=ALL_CLIENTS.find(x=>x.id===cid); return c? c.name : "—"; }
// Status flags are Admin-defined under System Management → Statuses, so
// nothing here is hardcoded to a specific status name anymore.
function isDeliveryStatusName(statusName){
  const s = ALL_STATUSES.find(x=>x.name===statusName);
  return !!(s && s.isDelivery);
}
function isDelayedStatusName(statusName){
  const s = ALL_STATUSES.find(x=>x.name===statusName);
  return !!(s && s.isDelayed);
}
function isOverdue(p){ return p.deadline && !isDeliveryStatusName(p.status) && new Date(p.deadline) < new Date(new Date().toDateString()); }
function daysUntil(d){ if(!d) return null; return Math.ceil((new Date(d)-new Date(new Date().toDateString()))/86400000); }
function slug(s){ return String(s).replace(/\s+/g,'-'); }
// Color-codes a status tag by its Admin-set flags rather than a fixed list
// of known names, so custom statuses an Admin adds later still get a
// sensible color without needing new CSS.
function statusTagStyle(statusName){
  if(isDeliveryStatusName(statusName)) return 'background:#DEF0E1;color:var(--green);';
  if(isDelayedStatusName(statusName)) return 'background:#FBEACB;color:#8A6512;';
  return 'background:#DDF0EE;color:var(--teal-dark);';
}

/* ============================================================
   LIVE DEADLINE COUNTDOWN — ticks every second.
   Deadlines are stored as a date only (no time), so the countdown
   assumes end-of-day (23:59:59) on the deadline date.
   ============================================================ */
function countdownText(deadline){
  if(!deadline) return '—';
  const target = new Date(deadline+'T23:59:59');
  if(isNaN(target.getTime())) return '—';
  let diff = target.getTime() - Date.now();
  const overdue = diff < 0;
  diff = Math.abs(diff);
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const parts = `${d}d ${h}h ${m}m ${s}s`;
  return overdue ? `${parts} overdue` : parts;
}
function tickCountdowns(){
  document.querySelectorAll('.live-countdown').forEach(el=>{
    const dl = el.dataset.deadline;
    const txt = countdownText(dl);
    el.textContent = txt;
    el.classList.toggle('overdue', txt.includes('overdue'));
  });
}
setInterval(tickCountdowns, 1000);

function wrapTables(){
  document.querySelectorAll('#main table').forEach(t => {
    if(t.parentElement && t.parentElement.classList.contains('table-scroll')) return;
    const w = document.createElement('div');
    w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
}
function navigate(view){
  closeNav();
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view || (view==='devDetail' && b.dataset.view==='dashboard')));

}

function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function rankBadge(i){
  const medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : '';
  return `${medal? medal+' ' : ''}#${i+1}`;
}

          <span>Target <b>${r.target||'—'}</b></span>
          <span>Delivered <b>${r.deliveries}</b></span>
          <span>Left <b>${r.target? r.remaining : '—'}</b></span>

// Company-wide summary cards — these show AGGREGATE numbers (target vs
// closed vs remaining, total deliveries, etc.) rather than repeating
// whoever is #1, since that person already appears at the top of the
// ranked list right below. Avoids showing "the same person twice".
function companyTargetSummaryHtml(salesStats){
  if(!salesStats.length) return `<div class="top-card empty-card">No sales reps yet.</div>`;
  const sumIndividual = salesStats.reduce((s,r)=>s+(r.target||0),0);
  const totalTarget = (COMPANY_SETTINGS.salesTarget>0) ? COMPANY_SETTINGS.salesTarget : sumIndividual;
  const totalClosed = salesStats.reduce((s,r)=>s+(r.amount||0),0);
  const remaining = Math.max(totalTarget-totalClosed,0);
  const pct = totalTarget ? Math.min(Math.round((totalClosed/totalTarget)*100),100) : 0;
  return `
    <div class="top-card">
      <div class="badge">🎯 Sales Target · ${monthLabel()}</div>
      <div class="stats" style="margin-bottom:12px;">
        <div class="stat-pill"><div class="k">Target</div><div class="v">${totalTarget? '$'+totalTarget.toLocaleString() : '—'}</div></div>
        <div class="stat-pill"><div class="k">Total Sales</div><div class="v">$${totalClosed.toLocaleString()}</div></div>
        <div class="stat-pill"><div class="k">Remaining</div><div class="v">${totalTarget? '$'+remaining.toLocaleString() : '—'}</div></div>
      </div>
      ${totalTarget ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--slate);margin-top:5px;">${pct}% of target reached</div>` : `<div class="setup-note">No sales target set yet — set a company-wide target in System Management, or an individual target per rep under Users.</div>`}
    </div>`;
}
function companyDevSummaryHtml(devStats){
  if(!devStats.length) return `<div class="top-card empty-card">No developers/freelancers yet.</div>`;
  const sumIndividual = devStats.reduce((s,r)=>s+(r.target||0),0);
  const totalTarget = (COMPANY_SETTINGS.deliveryTarget>0) ? COMPANY_SETTINGS.deliveryTarget : sumIndividual;
  const totalDeliveries = devStats.reduce((s,r)=>s+r.deliveries,0);
  const remaining = Math.max(totalTarget-totalDeliveries,0);
  const totalLate = devStats.reduce((s,r)=>s+r.deliveryLate,0);
  const rated = devStats.filter(r=>r.avgReview!==null);
  const avg = rated.length ? (rated.reduce((s,r)=>s+r.avgReview,0)/rated.length) : null;
  const pct = totalTarget ? Math.min(Math.round((totalDeliveries/totalTarget)*100),100) : 0;
  return `
    <div class="top-card">
      <div class="badge">🛠 Developer Snapshot · ${monthLabel()}</div>
      <div class="stats" style="margin-bottom:12px;">
        <div class="stat-pill"><div class="k">Target</div><div class="v">${totalTarget || '—'}</div></div>
        <div class="stat-pill"><div class="k">Delivered</div><div class="v">${totalDeliveries}</div></div>
        <div class="stat-pill"><div class="k">Remaining</div><div class="v">${totalTarget? remaining : '—'}</div></div>
      </div>
      ${totalTarget ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--slate);margin-top:5px;margin-bottom:12px;">${pct}% of delivery target reached</div>` : `<div class="setup-note" style="margin-bottom:12px;">No delivery target set yet — set a company-wide target in System Management, or an individual target per developer under Users.</div>`}
      <div class="stats">
        <div class="stat-pill"><div class="k">Late</div><div class="v">${totalLate}</div></div>
        <div class="stat-pill"><div class="k">Avg Review</div><div class="v">${avg!==null?avg.toFixed(1):'—'}</div></div>
      </div>
    </div>`;
}
function statCardsHtml(projects){
  const total = projects.length;
  const delayed = projects.filter(p=>isDelayedStatusName(p.status)).length;

// Per-developer stats for the selected month — Admin/PM only view.
// "Delivered" is driven by the Developing Stage flagged as the delivery
// stage in System Management, not by project status — since dev-facing
// stage tracking is what's actually meaningful to them.
function computeDevStats(){
  const devs = ALL_USERS.filter(u=>["Developer","Freelancer"].includes(u.role));
  const rows = devs.map(u=>{
    const own = ALL_PROJECTS.filter(p=>p.assignedDevId===(u.uid||u.id));
    const thisMonth = own.filter(p=> monthOf(p.startDate)===dashboardMonth || monthOf(p.createdAt)===dashboardMonth);
    const deliveries = own.filter(p=>p.deliveredAt && monthOf(p.deliveredAt)===dashboardMonth);
    const deliveryLate = deliveries.filter(p=>p.deadline && p.deliveredAt && p.deliveredAt > p.deadline).length;
    const extensions = thisMonth.reduce((s,p)=>s+(p.extensions||0),0);
    const rated = own.filter(p=>p.reviewRating);
    const avgReview = rated.length ? (rated.reduce((s,p)=>s+p.reviewRating,0)/rated.length) : null;
    const target = Number(u.monthlyDeliveryTarget)||0;
    const remaining = Math.max(target-deliveries.length,0);
    return { uid:(u.uid||u.id), user:u, team:u.team||'—', projectsThisMonth:thisMonth.length, deliveries:deliveries.length, deliveryLate, extensions, avgReview, target, remaining };
  });
  // Ranked by deliveries, then fewer late deliveries, then review score.
  return rows.sort((a,b)=> b.deliveries-a.deliveries || a.deliveryLate-b.deliveryLate || (b.avgReview||0)-(a.avgReview||0));
}
// Per-sales-rep amount for the selected month, plus target/remaining.
// Counted the moment a project is CREATED and assigned to that rep —
// sales closes the deal, it shouldn't wait on dev delivery to count.
function computeSalesStats(){
  const reps = ALL_USERS.filter(u=>u.role==="Sales");
  const rows = reps.map(u=>{
    const assigned = ALL_PROJECTS.filter(p=>p.salesOwnerId===(u.uid||u.id) && monthOf(p.createdAt)===dashboardMonth);
    const amount = assigned.reduce((s,p)=>s+(p.budget||0),0);
    const target = Number(u.monthlyTarget)||0;
    const remaining = Math.max(target-amount,0);
    return { uid:(u.uid||u.id), user:u, amount, target, remaining };
  });
  return rows.sort((a,b)=> b.amount-a.amount);
}

function isDeliveryStageName(stageName){
  const s = ALL_STAGES.find(x=>x.name===stageName);

async function saveProject(id){
  const existing = id ? ALL_PROJECTS.find(p=>p.id===id) : null;
  const newStatus = val('f_status');
  const newStage = val('f_stage');
  const canReview = ["Admin","Project Manager"].includes(CURRENT_USER.role);
  const doc = {
    profileName: val('f_name'), clientId: val('f_client'), teamLeadId: val('f_lead'),
    assignedDevId: val('f_dev'), salesOwnerId: val('f_sales'), status: newStatus,
    priority: val('f_priority'), startDate: val('f_start'), deadline: val('f_deadline'),
    budget: Number(val('f_budget'))||0,
    profileTags: val('f_profiletag') ? [val('f_profiletag')] : [],
    developingStage: newStage,
    extensions: Number(val('f_extensions'))||0,
    reviewRating: canReview
      ? (val('f_review') ? Number(val('f_review')) : (existing?existing.reviewRating:null) || null)
      : (existing ? (existing.reviewRating||null) : null),
    assignedPMId: existing ? (existing.assignedPMId||CURRENT_USER.uid) : CURRENT_USER.uid
  };
  // Auto-track completion date the first time status flips to a status
  // Admin flagged as "Completed" under System Management → Statuses.
  if(isDeliveryStatusName(newStatus) && !(existing && existing.completedAt)){
    doc.completedAt = new Date().toISOString().slice(0,10);
  } else if(existing && existing.completedAt){
    doc.completedAt = existing.completedAt;
  }
  // Auto-track delivery date the first time EITHER the Developing Stage
  // hits whichever stage Admin flagged as "Delivered", OR the Status hits
  // whichever status Admin flagged as "Delivered" (e.g. marking a project
  // Completed also counts it delivered, even if its stage wasn't updated).
  if((isDeliveryStageName(newStage) || isDeliveryStatusName(newStatus)) && !(existing && existing.deliveredAt)){
    doc.deliveredAt = new Date().toISOString().slice(0,10);
  } else if(existing && existing.deliveredAt){
    doc.deliveredAt = existing.deliveredAt;
  }
  if(id){
    await db.collection('projects').doc(id).update(doc);
  } else {
    doc.createdAt = new Date().toISOString().slice(0,10);
    await db.collection('projects').add(doc);
  }
  closeModal(); await refreshAndRender();
}

function escHtml(s){

function sortedUsers(list){

function repositionUserDragRow(tbody, dragRow, clientY){
  const rows = [...tbody.querySelectorAll('.user-drag-row')].filter(r=>r!==dragRow);
  let before = null;
  for(const r of rows){
    const rect = r.getBoundingClientRect();
    if(clientY < rect.top + rect.height/2){ before = r; break; }
  }
  if(before){
    if(dragRow.nextElementSibling !== before) tbody.insertBefore(dragRow, before);
  }else{
    const last = rows[rows.length - 1];
    if(last && dragRow !== last) tbody.insertBefore(dragRow, last.nextSibling);
  }
}
let userRowSortReady = false;
function initUserRowSort(){
  if(userRowSortReady) return;
  userRowSortReady = true;
  let dragRow = null;
  let captureEl = null;
  function onMove(e){
    if(!dragRow) return;
    e.preventDefault();
    const tbody = dragRow.closest('#userRowList');
    if(!tbody) return;
    repositionUserDragRow(tbody, dragRow, e.clientY);
  }
  function onEnd(e){
    if(!dragRow) return;
    dragRow.classList.remove('dragging');
    document.body.classList.remove('user-row-dragging');
    if(captureEl){
      try{ captureEl.releasePointerCapture(e.pointerId); }catch(_){}
    }
    const tbody = dragRow.closest('#userRowList');
    dragRow = null;
    captureEl = null;
    USER_ROW_DRAGGING = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
    if(tbody) saveUserRowOrder();
  }
  document.addEventListener('pointerdown', e=>{
    const handle = e.target.closest('.drag-handle');
    if(!handle || e.button !== 0) return;
    const tbody = handle.closest('#userRowList');
    if(!tbody) return;
    const row = handle.closest('.user-drag-row');
    if(!row || !row.dataset.id) return;
    e.preventDefault();
    dragRow = row;
    captureEl = handle;
    USER_ROW_DRAGGING = true;
    row.classList.add('dragging');
    document.body.classList.add('user-row-dragging');
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onEnd);
    document.addEventListener('pointercancel', onEnd);
  });
}
function bindUserRowSort(){ initUserRowSort(); }
async function saveUserRowOrder(){
  const tbody = document.getElementById('userRowList');
  if(!tbody) return;
  const ids = [...tbody.querySelectorAll('.user-drag-row')].map(r=>r.dataset.id);
  USER_ORDER = ids;

}

async function saveUser(id){
  if(!id && !isCompanyAdminUser()){
    alert("Only a Company admin can create logins.");
    return;
  }
  const chosenRole = val('f_urole');
  const email = (val('f_uemail')||'').trim();
  const pass = val('f_upass');
  const name = val('f_uname').trim();
  if(!name){ alert('Name is required.'); return; }
  const doc = {
    name, role: chosenRole, team: val('f_uteam'), workHours: val('f_uhours'),
    contact: val('f_ucontact').trim() || email,
    profiles: val('f_uprofiles').split(',').map(s=>s.trim()).filter(Boolean),
    active: document.getElementById('f_uactive') ? document.getElementById('f_uactive').checked : true,
    monthlyTarget: Number(val('f_utarget'))||0,
    monthlyDeliveryTarget: Number(val('f_udevtarget'))||0
  };
  try{
    if(id){
      await db.collection('users').doc(id).update(doc);
      if(pass && pass.trim()){
        if(!isCompanyAdminUser()){ alert("Only a Company admin can change passwords."); return; }
        if(pass.length < 6){ alert('Password must be at least 6 characters.'); return; }
        firebase.localAuth.setPasswordByUid(id, pass);
      }
    } else {
      if(!email || !pass){ alert('Email and password are required.'); return; }
      if(pass.length < 6){ alert('Password must be at least 6 characters.'); return; }
      let cred;
      try{
        cred = await secondaryAuth.createUserWithEmailAndPassword(email, pass);
      }catch(e){
        if(e.code === 'auth/email-already-in-use'){
          alert('This email already has a login. Use a different email, or edit the existing user.');
        } else {
          alert(e.message || String(e));
        }
        try{ await secondaryAuth.signOut(); }catch(_){}
        return;
      }
      doc.loginEmail = email;
      await db.collection('users').doc(cred.user.uid).set(doc);
      await secondaryAuth.signOut();
      alert(name + " created. They sign in with " + email + " from the " + portalLabelForRole(chosenRole) + " profile.");
    }
    closeModal();
    await refreshAndRender();
  }catch(e){
    alert(e.message || String(e));
    try{ await secondaryAuth.signOut(); }catch(_){}
  }
}

  const doc = { name, gigNames };
  try{
    if(id) await db.collection('profiles').doc(id).set(doc, { merge:true });
    else await db.collection('profiles').add(doc);
    closeModal(); await refreshAndRender();
  }catch(e){
    console.error('saveProfile failed', e);
    alert('Could not save profile. Make sure node server.js is running.');
  }
}
async function deleteProfile(id){
  if(!canManageProfiles()) return;
  if(!confirm('Delete this profile?')) return;
  await db.collection('profiles').doc(id).delete();
  await refreshAndRender();
}

/* ============================================================
   SYSTEM MANAGEMENT (Admin only)
   One control panel, split into sub-tabs so it can keep growing
   without turning into a giant scroll of unrelated settings:
     - Targets           company-wide sales/delivery numbers
     - Developing Stages  the per-project stage pipeline
     - Statuses           the per-project status dropdown
     - Rules              placeholder for future automation rules
   ============================================================ */
const SYSTEM_TABS = [
  ["targets","Targets"],
  ["stages","Developing Stages"],
  ["statuses","Statuses"],
  ["rules","Rules"]
];
function switchSystemTab(tab){ systemTab = tab; renderSystemManagement(); }
function systemTabsHtml(){
  return `<div style="display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:0;overflow-x:auto;flex-wrap:wrap;">
    ${SYSTEM_TABS.map(([id,label])=>`<button onclick="switchSystemTab('${id}')" style="background:${systemTab===id?'var(--panel)':'transparent'};border:1px solid var(--line);border-bottom:${systemTab===id?'1px solid var(--panel)':'1px solid var(--line)'};margin-bottom:-1px;padding:8px 14px;font-size:13px;font-weight:600;color:${systemTab===id?'var(--ink)':'var(--slate)'};border-radius:6px 6px 0 0;">${label}</button>`).join('')}
  </div>`;
}
function renderSystemManagement(){
  if(CURRENT_USER.role!=="Admin"){ document.getElementById('main').innerHTML='<div class="empty">Admin only.</div>'; return; }
  const bodies = {
    targets: systemTargetsHtml(),
    stages: systemStagesHtml(),
    statuses: systemStatusesHtml(),
    rules: systemRulesHtml()
  };
  document.getElementById('main').innerHTML = `
    <div class="topline"><h2>System Management</h2></div>
    ${systemTabsHtml()}
    ${bodies[systemTab] || bodies.targets}
  `;
}

function systemTargetsHtml(){
  return `
    <h3 style="margin:0 0 8px;font-size:15px;">Company-Wide Targets</h3>
    <div class="setup-note" style="margin-bottom:14px;max-width:640px;">Sets the overall dashboard summary targets. Leave a field at 0 to fall back to the sum of each rep's / developer's individual target (set under Users → Edit).</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;max-width:640px;">
      <div style="flex:1;min-width:220px;">
        <label>Total Monthly Sales Target ($)</label>
        <input id="f_companysales" type="number" min="0" value="${COMPANY_SETTINGS.salesTarget||''}">
      </div>
      <div style="flex:1;min-width:220px;">
        <label>Total Monthly Delivery Target (# projects)</label>
        <input id="f_companydelivery" type="number" min="0" value="${COMPANY_SETTINGS.deliveryTarget||''}">
      </div>
    </div>
    <button class="add-btn" onclick="saveCompanyTargets()">Save Targets</button>
  `;
}
async function saveCompanyTargets(){
  await db.collection('settings').doc('company').set({
    salesTarget: Number(val('f_companysales'))||0,
    deliveryTarget: Number(val('f_companydelivery'))||0
  }, { merge: true });
  await refreshAndRender();
}

function systemStagesHtml(){
  return `
    <h3 style="margin:0 0 8px;font-size:15px;">Developing Stages</h3>
    <div class="setup-note" style="margin-bottom:14px;max-width:640px;">These are the stages available on every project (e.g. Design, Development, QA, Delivered) and shown on developer detail pages. Flag one or more as "Delivered" — when a project's stage is set to it, the project counts as delivered toward that developer's monthly deliveries on the dashboard.</div>
    <div class="topline" style="border:none;margin-bottom:10px;padding-bottom:0;"><span></span><button class="add-btn" onclick="openStageModal()">+ New Stage</button></div>
    <table><thead><tr><th>Stage Name</th><th>Delivery Stage?</th><th></th></tr></thead>
    <tbody>${ALL_STAGES.map(s=>`<tr><td>${s.name}</td><td>${s.isDelivery?'✅ Yes':'—'}</td><td class="row-actions"><button onclick="deleteStage('${s.id}')">Delete</button></td></tr>`).join('') || '<tr><td class="empty" colspan="3">No stages defined yet (e.g. Design, Development, QA, Delivered).</td></tr>'}</tbody></table>
  `;
}
function openStageModal(){
  showModal(`
    <h3>New Developing Stage</h3>
    <label>Stage Name</label><input id="f_stagename" placeholder="e.g. QA">
    <label><input type="checkbox" id="f_stagedelivery" style="width:auto;display:inline;margin-right:6px;"> Counts as "Delivered"</label>
    <div class="setup-note">When a project's Developing Stage is set to a stage flagged this way, it marks the project delivered and counts toward that developer's monthly deliveries on the dashboard.</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveStage()">Save</button>
    </div>
  `);
}
async function saveStage(){
  await db.collection('stages').add({ name: val('f_stagename'), isDelivery: document.getElementById('f_stagedelivery').checked });
  closeModal(); await refreshAndRender();
}
async function deleteStage(id){
  if(!confirm('Delete this stage?')) return;
  await db.collection('stages').doc(id).delete();
  await refreshAndRender();
}

function systemStatusesHtml(){
  return `
    <h3 style="margin:0 0 8px;font-size:15px;">Statuses</h3>
    <div class="setup-note" style="margin-bottom:14px;max-width:640px;">This is the Status dropdown shown on every project. Flag a status as <b>Delivered</b> if reaching it should mark the project delivered — e.g. finishing a "Completed" status counts it as delivered even if no one updated the Developing Stage. Flag a status as <b>Delayed</b> if it should count toward the "Delayed" number on dashboards (e.g. "Waiting on Client", "On Hold").</div>
    <div class="topline" style="border:none;margin-bottom:10px;padding-bottom:0;"><span></span><button class="add-btn" onclick="openStatusModal()">+ New Status</button></div>
    <table><thead><tr><th>Status Name</th><th>Delivered?</th><th>Delayed?</th><th></th></tr></thead>
    <tbody>${ALL_STATUSES.map(s=>`<tr><td>${s.name}</td><td>${s.isDelivery?'✅ Yes':'—'}</td><td>${s.isDelayed?'✅ Yes':'—'}</td><td class="row-actions"><button onclick="deleteStatus('${s.id}')">Delete</button></td></tr>`).join('') || '<tr><td class="empty" colspan="4">No statuses defined yet (e.g. Not Started, In Progress, Completed).</td></tr>'}</tbody></table>
  `;
}
function openStatusModal(){
  showModal(`
    <h3>New Status</h3>
    <label>Status Name</label><input id="f_statusname" placeholder="e.g. In QA">
    <label><input type="checkbox" id="f_statusdelivery" style="width:auto;display:inline;margin-right:6px;"> Counts as "Delivered" (e.g. Completed)</label>
    <label><input type="checkbox" id="f_statusdelayed" style="width:auto;display:inline;margin-right:6px;"> Counts as "Delayed" (e.g. Waiting on Client, On Hold)</label>
    <div class="setup-note">A project reaching a status flagged "Delivered" is marked delivered — the same as reaching a Developing Stage flagged "Delivered." A status usually shouldn't be both.</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveStatus()">Save</button>
    </div>
  `);
}
async function saveStatus(){
  const name = val('f_statusname').trim();
  if(!name){ alert('Status name is required.'); return; }
  await db.collection('statuses').add({
    name,
    isDelivery: document.getElementById('f_statusdelivery').checked,
    isDelayed: document.getElementById('f_statusdelayed').checked
  });
  closeModal(); await refreshAndRender();
}
async function deleteStatus(id){
  if(!confirm('Delete this status? Any project currently set to it will keep the text value, but it will no longer appear in the dropdown.')) return;
  await db.collection('statuses').doc(id).delete();
  await refreshAndRender();
}

function systemRulesHtml(){
  return `
    <h3 style="margin:0 0 8px;font-size:15px;">Rules</h3>
    <div class="setup-note" style="margin-bottom:14px;max-width:640px;">A home for other automation rules as they're added — for example, auto-flagging a project as delayed after N days with no update, or auto-notifying a Team Lead when a deadline is missed. None are built yet.</div>
    <div class="empty">No rules yet — this tab is reserved for future automation.</div>
  `;
}

/* ============================================================
   MODAL HELPERS
   ============================================================ */
function showModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalBg').style.display='flex'; }
function closeModal(){ document.getElementById('modalBg').style.display='none'; }
function val(id){ const el=document.getElementById(id); return el? el.value : ''; }
function toggleTargetField(){
  const role = val('f_urole');
  const salesWrap = document.getElementById('targetFieldWrap');
  const devWrap = document.getElementById('devTargetFieldWrap');
  const hint = document.getElementById('portalHint');
  if(salesWrap) salesWrap.style.display = (role==='Sales') ? 'block' : 'none';
  if(devWrap) devWrap.style.display = (["Developer","Freelancer"].includes(role)) ? 'block' : 'none';
  if(hint){
    const g = PORTAL_GROUPS.find(p => p.roles.includes(role));
    if(role === "Admin"){
      hint.innerHTML = "They sign in <b>only from the Company profile</b> and get the same full access as Sanaul.";
    } else {
      hint.innerHTML = `They will sign in from the <b>${g?g.label:'matching'}</b> profile and open the <b>${portalLabelForRole(role)}</b>.`;
    }
  }
}
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
initUserRowSort();
</script>
</body>
</html>
